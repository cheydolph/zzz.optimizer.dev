<!-- Full-screen black loading overlay (in-game style) -->
@if (show()) {
  <div class="loading-screen" animate.leave="fx-overlay-leave">
    <!-- ZZZ Logo in center with radial fade -->
    <div class="logo-center">
      <div class="logo-fade-mask">
        <!-- PERF-12: the former GIF as a muted looping video; the poster is its first frame and is all that shows
             under reduced motion -->
        <video
          #logoVideo
          src="assets/data/images/page-icons/zzz-zenless-zone-zero.mp4"
          poster="assets/data/images/page-icons/zzz-zenless-zone-zero-poster.webp"
          [autoplay]="motionAllowed()"
          [loop]="true"
          [muted]="true"
          [attr.playsinline]="true"
          role="img"
          aria-label="Zenless Zone Zero"
          class="zzz-logo">
        </video>
      </div>
    </div>
    <!-- Bangboo video in bottom right corner; the poster (its first frame) shows under reduced motion -->
    <div class="bangboo-container">
      <video
        #bangbooVideo
        [src]="'assets/data/images/page-icons/bangbooloading.mp4'"
        poster="assets/data/images/page-icons/bangbooloading-poster.webp"
        [autoplay]="motionAllowed()"
        [loop]="true"
        [muted]="true"
        [attr.playsinline]="true"
        class="bangboo-video">
      </video>
    </div>
  </div>
}
